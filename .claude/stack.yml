# .claude/stack.yml — dev-core stack configuration
# DO NOT commit this file. Add `.claude/stack.yml` to .gitignore.
# Commit stack.yml.example instead (no sensitive values).

schema_version: "1.0"

# Runtime and package manager used for all commands
runtime: bun
package_manager: bun

backend:
  framework: none
  orm: none
  path: ""

frontend:
  framework: none
  path: ""
  ui_package: ""
  ui_src: ""

shared:
  types: ""
  ui: ""
  config: ""

build:
  orchestrator: none
  orchestrator_config: ""
  formatter: eslint
  formatter_config: ""
  formatter_fix_cmd: ""

testing:
  unit: vitest
  e2e: none

hooks:
  tool: none

lsp:
  enabled: true

deploy:
  platform: none
  secrets_cmd: ""

docs:
  framework: none
  path: docs
  format: md

commands:
  dev: bun run dev
  build: bun run build
  test: bun run test
  lint: bun run lint
  typecheck: bun run typecheck
  format: ""
  install: bun install

artifacts:
  analyses: artifacts/analyses
  specs: artifacts/specs
  frames: artifacts/frames
  plans: artifacts/plans

standards:
  backend: ""
  frontend: ""
  testing: docs/standards/testing.md
  code_review: docs/standards/code-review.md
  architecture: docs/architecture/
  configuration: ""
  deployment: ""
  troubleshooting: ""
  issue_management: ""
  dev_process: ""
  contributing: ""
